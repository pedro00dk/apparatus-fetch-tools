name: CICD

on:
    push:
        branches: [main]
    release:
        types: [published]

jobs:
    ci:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Check types
              run: bun check

            - name: Test package
              run: bun run test

            - name: Build package
              run: bun run build

            - name: Publish package
              if: github.event_name == 'release'
              run: |
                  bun install -g npm@latest
                  bun x npm publish --provenance --access public
